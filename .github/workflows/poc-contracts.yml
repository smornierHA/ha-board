name: POC application contracts
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: poc-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Record actual checked-out revision
        run: git rev-parse HEAD HEAD^{tree}
      - name: Preserve original import and verify candidate syntax
        run: |
          node --version
          node --check src/person-history-map-card-v14.js
          node --check src/person-rich-card-v34.js
          node --check src/candidate/person-history-map-card-v14.js
          node --check src/candidate/person-rich-card-v34.js
          node --check src/candidate/history-address-adapter.mjs
          python3 scripts/check_import.py
          python3 scripts/check_candidate.py
          python3 scripts/check_weather.py
          node --check src/candidate/weather-combined-forecast-card.js
          node tests/weather-contracts.mjs
      - name: Strict behavioral contracts on candidate
        env:
          POC_SOURCE_DIR: ${{ github.workspace }}/src/candidate
          POC_REPORT_DIR: ${{ github.workspace }}/artifacts
        run: node tests/contracts.mjs
      - name: Historical address adapter contracts
        run: node tests/history-address-adapter.mjs
      - name: Build and test HACS entrypoint
        run: |
          python3 scripts/build_hacs.py
          git diff --exit-code -- dist
          node --check dist/ha-board.js
          node tests/bundle-smoke.mjs
          WEATHER_SOURCE=dist/weather-combined-forecast-card.js node tests/weather-contracts.mjs
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          POC_BUNDLE="$PWD/dist/ha-board.js" POC_SOURCE_DIR="$PWD/src/candidate" POC_REPORT_DIR="$PWD/artifacts/bundle" node tests/contracts.mjs
      - name: Fictitious weather browser contracts
        run: node --experimental-websocket tests/weather-browser.mjs
      - name: Save fictitious browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: weather-browser-${{ github.sha }}
          path: artifacts/weather-browser/
          if-no-files-found: error
          retention-days: 14
      - name: Project documentation
        run: python3 scripts/check_project_docs.py
  candidate-release:
    needs: contracts
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Publish candidate from the tested integrated SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_candidate.py

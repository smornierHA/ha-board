<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Weather Combined Forecast — démonstration fictive</title>
<style>body{font-family:Arial,sans-serif;margin:0;padding:24px;background:#101827;color:#eef4ff;--primary-text-color:#eef4ff;--secondary-text-color:#b0bdd0;--ha-card-background:#202e44}body.light{background:#e9eef5;color:#182333;--primary-text-color:#182333;--secondary-text-color:#526176;--ha-card-background:#f7faff}main{max-width:850px;margin:auto}h1{font-size:22px;margin:0 0 8px}p{font-size:13px;line-height:1.5}weather-combined-forecast-card{display:block;margin:20px 0}ha-card{display:block}button,select{padding:8px;border-radius:8px;border:1px solid #9aa8bf}label{display:block;margin:8px 0}#actions{min-height:22px}a{color:inherit}</style>
<main><h1>Weather Combined Forecast</h1><p>Données fictives · Horloge figée au 15 janvier 2026 · Aucun accès à Home Assistant.<br>Le rendu des icônes et du formulaire utilise des composants de simulation.</p><button id="theme">Clair / sombre</button> <button id="mode">Risques : footer / en-tête</button> <button id="navigation">Détacher / reconnecter</button><div id="cards"></div><p id="actions">Les actions sont simulées.</p><details><summary>Éditeur de démonstration (ha-form simulé)</summary><div id="editor"></div></details></main>
<script type="module">
const NativeDate=Date;globalThis.Date=class extends NativeDate{constructor(...args){super(...(args.length?args:['2026-01-15T21:30:00Z']));}static now(){return +new NativeDate('2026-01-15T21:30:00Z');}};
customElements.define('ha-card',class extends HTMLElement{connectedCallback(){this.style.display='block';}});
customElements.define('ha-icon',class extends HTMLElement{connectedCallback(){this.style.cssText='display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;font-size:18px';const name=this.getAttribute('icon')||'';this.textContent=name.includes('wind')?'↗':name.includes('lightning')?'ϟ':'!';}});
customElements.define('ha-form',class extends HTMLElement{set data(data){this._data=data;this.innerHTML='<label>Titre <input></label><label>Afficher l’en-tête <input type="checkbox"></label>';const [title,show]=this.querySelectorAll('input');title.value=data.title||'';show.checked=data.show_header!==false;title.onchange=()=>this.emit({title:title.value});show.onchange=()=>this.emit({show_header:show.checked});}emit(patch){this.dispatchEvent(new CustomEvent('value-changed',{detail:{value:{...this._data,...patch}},bubbles:true}));}});
const source=new URLSearchParams(location.search).get('source')==='candidate'?'../src/candidate/weather-combined-forecast-card.js':'../dist/weather-combined-forecast-card.js';
await import(source);
const forecast=Array.from({length:18},(_,i)=>({datetime:new Date(Date.UTC(2026,0,15,21+i)).toISOString(),temperature:[8,7,5,3,1,0,-1,0,2,4,6,8,9,10,9,8,7,6][i],precipitation:i===3?2.4:i===4?0.8:0,precipitation_probability:i===3?80:i===4?40:0,wind_speed:10+i,wind_gust_speed:20+i,wind_bearing:290+i*8,condition:i<6?'partlycloudy':'sunny'}));
const states={'sensor.example_hourly':{state:'ok',attributes:{forecast}},'weather.example':{state:'partlycloudy',attributes:{temperature:8,wind_speed:10,wind_bearing:290}},'sun.sun':{state:'below_horizon',attributes:{next_rising:'2026-01-16T07:30:00Z',next_setting:'2026-01-16T17:00:00Z'}},'sensor.example_alert':{state:'orange',attributes:{Orages:'orange','Vent violent':'jaune'}},'sensor.example_risk':{state:'fort',attributes:{message:'Risque fictif'}}};
let releases=0,subscriptions=0;const connection={connected:true,subscribeMessage(callback){subscriptions++;callback({forecast:[{datetime:'2026-01-15T12:00:00Z',temperature:10,templow:0}]});return Promise.resolve(()=>{releases++;});},addEventListener(){},removeEventListener(){}};
const config={type:'custom:weather-combined-forecast-card',title:'Station exemple',forecast_entity:'sensor.example_hourly',weather_entity:'weather.example',hours_to_show:16,bearing_reference_mode:'custom',bearing_rotation:30,show_header:true,show_header_temperature_range:true,risk_entities:[{mode:'weather_alert_pills',entity:'sensor.example_alert',show_secondary_line:true,tap_action:{action:'more-info',entity:'sensor.example_alert'}},{entity:'sensor.example_risk',icon:'mdi:weather-windy',label:'Vent fictif',show_secondary_line:true,tap_action:{action:'none'}}],main_header_tap_action:{action:'navigate',navigation_path:'#example-weather'},unknown_option:{keep:true},grid_options:{columns:12}};
const card=document.createElement('weather-combined-forecast-card');card.setConfig(config);card.hass={states,connection,callService:(...args)=>{document.querySelector('#actions').textContent='Service simulé : '+JSON.stringify(args);}};document.querySelector('#cards').append(card);
card.addEventListener('hass-more-info',e=>document.querySelector('#actions').textContent='Information simulée : '+e.detail.entityId);
const editor=await card.constructor.getConfigElement();editor.setConfig(config);editor.hass=card._hass;editor.addEventListener('config-changed',e=>{window.savedConfig=e.detail.config;card.setConfig(e.detail.config);});document.querySelector('#editor').append(editor);
document.querySelector('#theme').onclick=()=>document.body.classList.toggle('light');document.querySelector('#mode').onclick=()=>card.setConfig({...card.config,risk_display_mode:card.config.risk_display_mode==='footer'?'header_sub_buttons':'footer'});document.querySelector('#navigation').onclick=()=>{card.remove();document.querySelector('#cards').append(card);};
window.demo={card,editor,config,get subscriptions(){return subscriptions;},get releases(){return releases;}};window.demoReady=true;
</script></html>

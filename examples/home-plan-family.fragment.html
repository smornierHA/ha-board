  <script>
  (() => {
    const root = document.getElementById('hpf-preview');

    const rooms = data.rooms, bounds = data.bounds;
    let selected = null, view = 'plan', filter = '', opener = null, recent = data.preview?.room || null, quick = null;
    const photoIndex = new Map();
    const originalPhoto = new Set();
    const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

    const coverState = c => !Number.isFinite(c.position) ? 'Position inconnue' : c.position === 0 ? 'Fermé' : c.position === 100 ? 'Ouvert' : c.position+' % ouvert';
    const photo = room => room.illustration && !originalPhoto.has(room.id) ? room.illustration : room.photos?.[photoIndex.get(room.id)||0];
    const apertures = data.apertures || [];
    const apertureRoom = a => rooms.find(r=>r.id===a.room);
    const apertureSensor = a => apertureRoom(a)?.openings?.[a.opening];
    const apertureCover = a => covers(apertureRoom(a)).find(c=>c.id===a.cover);
    const aperturePath = a => `M${a.segment[0]} ${a.segment[1]}L${a.segment[2]} ${a.segment[3]}`;
    const coverMarkup = (room,c) => `<div class="hpf-cover" data-cover-id="${esc(c.id)}"><label class="hpf-cover-caption" for="hpf-${esc(c.id)}">${icon('blinds')}<span>${esc(c.name)}</span><output for="hpf-${esc(c.id)}">${esc(coverState(c))}</output></label><input id="hpf-${esc(c.id)}" data-key="${esc(c.id)}-position" data-position="${esc(c.id)}" type="range" min="0" max="100" value="${Number.isFinite(c.position)?c.position:50}" ${Number.isFinite(c.position)?'':'disabled'} aria-label="Pourcentage d’ouverture de ${esc(c.name)}"><div class="hpf-cover-actions"><button type="button" class="cursor-interaction" data-cover="100" data-cover-id="${esc(c.id)}" data-key="${esc(c.id)}-open">${icon('chevron-up')}Ouvrir</button><button type="button" class="cursor-interaction" data-cover="stop" data-cover-id="${esc(c.id)}" data-key="${esc(c.id)}-stop">${icon('square')}Arrêter</button><button type="button" class="cursor-interaction" data-cover="0" data-cover-id="${esc(c.id)}" data-key="${esc(c.id)}-close">${icon('chevron-down')}Fermer</button></div></div>`;
    function openingMarkup(o) { return `<div class="hpf-opening ${o.open===true?'is-open':''}">${icon(o.name.toLowerCase().includes('fenêtre')?'panels-top-left':'door-open')}<span>${esc(o.name)}</span><strong>${o.open===true?'Ouverte':o.open===false?'Fermée':'État inconnu'}</strong></div>`; }

        const o=apertureSensor(a), c=apertureCover(a), s=a.segment, p=aperturePath(a), vertical=s[0]===s[2], shift=vertical?-12:12;

        const closed=Number.isFinite(c?.position)?100-c.position:0;
        return `${o?.open===true?`<path class="aperture-halo" d="${p}"/>`:''}<path data-map-aperture="${esc(a.id)}" class="aperture-line cursor-interaction ${o?.open===true?'is-open':''}" d="${p}"/>${o?.open===true?`<path class="aperture-leaf" d="M${s[0]} ${s[1]}l${vertical?22:0} ${vertical?0:-22}"/>`:''}${c?`<path data-map-aperture="${esc(a.id)}" class="shutter-track cursor-interaction" d="${parallel}"/><path data-map-aperture="${esc(a.id)}" class="shutter-fill cursor-interaction" d="${parallel}" pathLength="100" stroke-dasharray="${closed} 100"/>${filter==='covers'?`<path class="aperture-leader" d="M${(s[0]+s[2])/2} ${(s[1]+s[3])/2}L${a.control[0]} ${a.control[1]}"/>`:''}`:''}`;

        const label = r.label || [r.x+r.w/2,r.y+r.h/2];

      }).join('');
      if(view==='plan')map.insertAdjacentHTML('beforeend',`<svg class="hpf-aperture-layer" viewBox="${bounds.join(' ')}" aria-hidden="true">${apertureArtwork()}</svg>`);

        const r=apertureRoom(a),o=apertureSensor(a),c=apertureCover(a),p=a.control||[(a.segment[0]+a.segment[2])/2,(a.segment[1]+a.segment[3])/2];
        return `<button type="button" class="hpf-aperture cursor-interaction ${c?'has-cover':''} ${filter==='covers'?'show-value':''} ${o?.open===true?'is-open':''} ${matches(r)?'':'is-muted'}" data-aperture="${esc(a.id)}" aria-label="${esc(a.name)}, ${o?o.open===true?'ouverte':o.open===false?'fermée':'état inconnu':'contact non suivi'}${c?', '+esc(c.name)+' '+esc(coverState(c)):''}. Commandes" style="left:clamp(22px,${(p[0]-bounds[0])/bounds[2]*100}%,calc(100% - 22px));top:${(p[1]-bounds[1])/bounds[3]*100}%"><span class="hpf-aperture-mark">${icon(c?'blinds':'door-open')}${c?`<span>${c.position===0?'Fermé':c.position===100?'Ouvert':Number.isFinite(c.position)?c.position+' %':'?'}</span>`:''}</span></button>`;

      const legend=root.querySelector('.hpf-map-legend');legend.hidden=view!=='plan';legend.innerHTML=`<span class="opening-key">${icon('door-open')}Porte / fenêtre ouverte</span><span class="cover-key">${icon('blinds')}${filter==='covers'?'Volet · % d’ouverture':'Toucher pour le volet'}</span>`;

      if (focusedRoom && !sheet.open) root.querySelector(`[data-room="${CSS.escape(focusedRoom)}"]`)?.focus({preventScroll:true});

    }
    function roomSheet(room) {

      sheet.innerHTML = `<div class="hpf-sheet-head"><div><h3 id="hpf-sheet-title">${esc(room.name)}</h3><span class="hpf-sheet-sub">${esc(room.temperature ? room.temperature+' · '+data.floor : data.floor)}</span></div><button type="button" class="hpf-close cursor-interaction" data-close aria-label="Revenir au plan">${icon('x')}</button></div>` +
      (photo(room) ? `<div class="hpf-room-photo"><img src="${esc(photo(room))}" alt="${room.illustration&&!originalPhoto.has(room.id)?'Illustration de ':'Photo de '}${esc(room.name)}">${room.illustration?`<button type="button" class="hpf-photo-style cursor-interaction" data-photo-style>${originalPhoto.has(room.id)?'Voir l’illustration':'Voir la photo'}</button>`:''}${room.photos?.length>1&&(!room.illustration||originalPhoto.has(room.id))?`<button type="button" class="hpf-photo-next cursor-interaction" data-next-photo aria-label="Photo suivante de ${esc(room.name)}">${(photoIndex.get(room.id)||0)+1} / ${room.photos.length}</button>`:''}</div>` : '') +

    });
    sheet.addEventListener('input', e => {if(e.target.matches('input[type=range]'))e.target.closest('.hpf-cover').querySelector('output').textContent=coverState({position:Number(e.target.value)});});
    sheet.addEventListener('change', e => {if(e.target.matches('input[type=range]')){const room=rooms.find(r=>r.id===selected),c=covers(room).find(c=>c.id===e.target.dataset.position);c.position=Number(e.target.value);draw();announce(`${c.name} : ${coverState(c)}`);}});
    sheet.addEventListener('keydown', e => {if(e.key==='Escape'){e.preventDefault();sheet.close();}});
    sheet.addEventListener('close', () => {if(sheet.open)return;selected=null;quick=null;draw();if(opener?.dataset?.aperture)root.querySelector(`[data-aperture="${CSS.escape(opener.dataset.aperture)}"]`)?.focus({preventScroll:true});else if(opener?.dataset?.room)root.querySelector(`[data-room="${CSS.escape(opener.dataset.room)}"]`)?.focus({preventScroll:true});else root.querySelector('[data-alerts]')?.focus({preventScroll:true});});
    draw();
  })();
  </script>
</div>

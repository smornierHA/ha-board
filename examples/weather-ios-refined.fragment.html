      const rain=[.2,.4,.8,.4,.2,0,0,0,0,0,0,0,0,.1,.2,.2,.1,0,0,0,0,0,0,0,0];
      const probability=[65,75,85,70,45,20,10,10,5,5,5,10,15,30,45,40,25,20,10,10,10,10,15,15,20];
      const windSpeed=[16,18,22,27,32,39,37,34,31,29,25,21,18,16,14,13,12,12,13,15,17,18,19,18,17];
      const windGust=[26,32,40,52,61,72,69,62,58,51,45,39,32,29,25,24,22,21,20,23,26,29,31,29,27];
      const data=temperatures.map((temperature,i)=>{const hour=(13+i)%24,sunset=i===6,sunrise=i===19;return {temperature,rain:rain[i],probability:probability[i],wind:windSpeed[i],gust:windGust[i],direction:28+i*11,time:i===0?'Maint.':sunset?'19:14':sunrise?'08:21':hour===0?'Dem.':`${String(hour).padStart(2,'0')} h`,fullTime:i===0?'Maintenant':sunset?'Coucher du soleil · 19:14':sunrise?'Lever du soleil · 08:21':`${hour} h${i>=11?' demain':''}`,solar:sunset||sunrise,icon:sunset?'sunset':sunrise?'sunrise':rain[i]?'cloud-drizzle':i>7&&i<18?'cloud-moon':i>3?'cloud-sun':'cloud-rain'};});
      const state={mode:'weather',scroll:0};
      const format=n=>String(n).replace('.',',');
      const icons=()=>{if(globalThis.lucide)lucide.createIcons({attrs:{'stroke-width':1.5}});};
      const weatherSymbol=(name,extra='')=>name==='cloud-drizzle'||name==='cloud-rain'?`<span class="wr-weather-symbol ${extra}" aria-hidden="true"><i class="wr-solid-cloud" data-lucide="cloud"></i><i class="wr-rain-marks" data-lucide="${name}"></i></span>`:`<i class="wr-weather-symbol ${extra} ${name==='cloud-sun'?'wr-symbol-sun':name==='cloud-moon'?'wr-symbol-moon':'wr-symbol-solar'}" data-lucide="${name}" aria-hidden="true"></i>`;
      function inlineWindChart(){
        const svg=document.createElementNS('http://www.w3.org/2000/svg','svg'),width=data.length*62,height=76;
        svg.classList.add('wr-wind-plot');svg.setAttribute('viewBox',`0 0 ${width} ${height}`);svg.setAttribute('role','img');svg.setAttribute('aria-label','Vent et rafales sur 24 heures en kilomètres par heure, alignés sur les heures. Vent de 12 à 39, rafales jusqu’à 72.');
        const x=i=>31+i*62,y=v=>70-v/80*60;
        const path=key=>data.map((d,i)=>i?`C ${x(i)-31} ${y(data[i-1][key])}, ${x(i)-31} ${y(d[key])}, ${x(i)} ${y(d[key])}`:`M ${x(i)} ${y(d[key])}`).join(' ');

      function render(){

      }
      root.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{state.scroll=rail.scrollLeft;state.mode=b.dataset.mode;render();}));
      q('.wr-tabs').addEventListener('keydown',event=>{const tabs=[...root.querySelectorAll('[data-mode]')],index=tabs.indexOf(document.activeElement);if(index<0)return;const next=event.key==='ArrowRight'?(index+1)%3:event.key==='ArrowLeft'?(index+2)%3:event.key==='Home'?0:event.key==='End'?2:null;if(next!==null){event.preventDefault();tabs[next].focus();tabs[next].click();}});
      q('.wr-next').addEventListener('click',()=>{const end=rail.scrollLeft>=rail.scrollWidth-rail.clientWidth-5;rail.scrollTo({left:end?0:rail.scrollLeft+Math.max(1,Math.floor(rail.clientWidth/62))*62,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});});
      rail.addEventListener('scroll',()=>{state.scroll=rail.scrollLeft;q('.wr-next').setAttribute('aria-label',rail.scrollLeft>=rail.scrollWidth-rail.clientWidth-5?'Revenir à maintenant':'Voir les heures suivantes');},{passive:true});
      const dialog=q('.wr-sheet'),content=q('.wr-sheet-content');let opener=null,view=null,allRisks=false;
      function show(title){opener=document.activeElement;q('#wr-sheet-title').textContent=title;content.replaceChildren();if(!dialog.open)dialog.showModal();q('.wr-close').focus();}
      function appendText(text){const p=document.createElement('p');p.className='wr-sheet-caption';p.textContent=text;content.append(p);}
      function appendRows(rows){const list=document.createElement('dl');list.className='wr-details';for(const [label,value] of rows){const item=document.createElement('div'),dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=label;dd.textContent=value;item.append(dt,dd);list.append(item);}content.append(list);}
      function chart(mode,index){
        const values=data.map(d=>mode==='weather'?d.temperature:mode==='rain'?d.rain:d.wind),max=Math.max(...values,mode==='wind'?Math.max(...data.map(d=>d.gust)):0),min=mode==='weather'?Math.min(...values)-2:0;
        const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.classList.add('wr-graph');const width=Math.max(220,content.clientWidth),height=105;svg.setAttribute('viewBox',`0 0 ${width} ${height}`);svg.setAttribute('role','img');svg.setAttribute('aria-label',mode==='weather'?'Courbe de température sur 24 heures':mode==='rain'?'Cumuls de pluie horaires sur 24 heures':'Courbes de vent et rafales sur 24 heures');

      function openHour(i){const d=data[i];view='hour';show(d.fullTime);appendText(state.mode==='weather'?'Température · °C':state.mode==='rain'?'Précipitations · mm':'Vent — trait plein · Rafales — pointillés · km/h');chart(state.mode,i);appendRows([['Température',`${d.temperature} °C`],['Pluie',`${format(d.rain)} mm · ${d.probability} %`],['Vent / rafales',`${d.wind} / ${d.gust} km/h`],['Direction',`${d.direction%360}° · référence maison`]]);icons();}
      q('.wr-hero').addEventListener('click',()=>{view='current';show('Météo actuelle');appendText('Pluie légère');chart('weather',0);appendRows([['Actuellement','14 °C'],['Minimum / maximum','9 °C / 17 °C'],['Pluie du jour','2,8 mm'],['Lever / coucher du soleil','08:21 / 19:14']]);icons();});
      const risks=[{id:'vigilance',title:'Vigilance orange',detail:'Vent violent · rafales jusqu’à 72 km/h',icon:'triangle-alert',active:true,severity:2,rows:[['Phénomène','Vent violent'],['Niveau','Orange — important'],['Rafales prévues','72 km/h'],['Période','À partir de 17 h']]},{id:'portail',title:'Portail',detail:'Risque fort · rafales prévues à 72 km/h',icon:'wind',active:true,severity:2,rows:[['Risque','Fort'],['Rafales prévues','72 km/h'],['Seuil moyen / fort','35 / 45 km/h']]},{id:'inondation',title:'Inondation',detail:'Aucune fuite détectée',icon:'waves',active:false,severity:0,rows:[['Détection','Aucune fuite'],['État','Normal']]},{id:'pluie',title:'Pluie',detail:'Pluie faible · 2,8 mm dans la journée',icon:'droplets',active:false,severity:0,rows:[['Cumul du jour','2,8 mm'],['Niveau','Faible']]},{id:'volets',title:'Volets',detail:'Risque faible',icon:'blinds',active:false,severity:0,rows:[['Niveau','Faible'],['Vent et température','Dans les seuils configurés']]}];
      const activeRisks=()=>risks.filter(r=>r.active).sort((a,b)=>b.severity-a.severity);
      function openRisk(r){
        if(!dialog.open)show(r.title);else{q('#wr-sheet-title').textContent=r.title;content.replaceChildren();}
        appendText(`${r.severity>=3?'Critique · ':r.severity>=2?'Important · ':''}${r.detail}`);appendRows(r.rows);
        const back=document.createElement('button');back.type='button';back.className='wr-risk cursor-interaction';back.textContent='Revenir aux risques';back.addEventListener('click',()=>{renderRisks();content.querySelector(`[data-risk="${r.id}"]`)?.focus();});content.append(back);q('.wr-close').focus();
      }
      function renderAlerts(){
        const active=activeRisks(),majors=active.filter(r=>r.severity>=2),major=majors[0],banner=q('.wr-major');banner.hidden=!major;
        if(major){const names=majors.map(r=>r.title).join(' · ');banner.dataset.level=major.severity>=3?'critical':'severe';q('.wr-major-title').textContent=(major.severity>=3?'Critique · ':'')+names;q('.wr-major-detail').textContent=major.detail;banner.setAttribute('aria-label',`${major.severity>=3?'Alerte critique':'Alerte importante'} : ${names}. ${major.detail}. Ouvrir le détail.`);banner.onclick=()=>{allRisks=false;if(majors.length>1){show('Météo et maison');renderRisks();}else openRisk(major);};}
        q('.wr-alert-count').textContent=active.length?`${active.length} alerte${active.length>1?'s':''}`:'Aucune alerte';q('.wr-alert-label').textContent=active.length?'Vent et portail':'Voir les états';q('.wr-alert-row').setAttribute('aria-label',`Consulter ${active.length} alerte${active.length>1?'s':''} active${active.length>1?'s':''} et tous les risques`);
      }
      function renderRisks(){
        q('#wr-sheet-title').textContent='Météo et maison';content.replaceChildren();const filters=document.createElement('div');filters.className='wr-risk-filters';filters.setAttribute('role','group');filters.setAttribute('aria-label','Filtrer les risques');
        for(const [all,label] of [[false,`Alertes (${activeRisks().length})`],[true,`Tout (${risks.length})`]]){const b=document.createElement('button');b.type='button';b.className='cursor-interaction';b.textContent=label;b.setAttribute('aria-pressed',String(allRisks===all));b.addEventListener('click',()=>{allRisks=all;renderRisks();content.querySelector('.wr-risk-filters button[aria-pressed="true"]').focus();});filters.append(b);}content.append(filters);
        const shown=allRisks?[...risks].sort((a,b)=>b.severity-a.severity):activeRisks();if(!shown.length)appendText('Aucune alerte active.');
        for(const r of shown){const b=document.createElement('button');b.type='button';b.className='wr-risk cursor-interaction';b.dataset.risk=r.id;b.dataset.active=r.active;b.dataset.severity=r.severity;b.innerHTML=`<i data-lucide="${r.icon}" aria-hidden="true"></i><span class="wr-risk-copy"><strong>${r.title}</strong><small>${r.detail}</small></span><i class="wr-chevron" data-lucide="chevron-right" aria-hidden="true"></i>`;b.addEventListener('click',()=>openRisk(r));content.append(b);}icons();
      }
      q('.wr-alert-row').addEventListener('click',()=>{view='risks';allRisks=false;show('Météo et maison');renderRisks();});
      q('.wr-close').addEventListener('click',()=>dialog.close());dialog.addEventListener('close',()=>{opener?.focus();view=null;});dialog.addEventListener('click',event=>{if(event.target===dialog){const r=dialog.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)dialog.close();}});
      render();renderAlerts();
      const canvas=q('.wr-sky'),ctx=canvas.getContext('2d');
      if(ctx){let w=0,h=0,frame=0,last=0,time=0,visible=true;const motion=matchMedia('(prefers-reduced-motion: reduce)'),drops=Array.from({length:28},()=>({x:Math.random(),y:Math.random(),speed:.25+Math.random()*.6,size:.5+Math.random()}));
        function paint(delta){time+=delta;ctx.clearRect(0,0,w,h);const dark=matchMedia('(prefers-color-scheme: dark)').matches;
          for(let i=0;i<4;i++){const x=((i*.35+time*.003)%1.5-.25)*w,y=h*(.05+i*.045),radius=w*(.33+i*.03),cloud=ctx.createRadialGradient(x,y,0,x,y,radius);cloud.addColorStop(0,dark?'rgba(194,211,222,.08)':'rgba(255,255,255,.27)');cloud.addColorStop(1,'rgba(220,234,246,0)');ctx.fillStyle=cloud;ctx.fillRect(0,0,w,h);}
          for(const d of drops){d.y+=delta*d.speed;const x=d.x*w-d.y*8,y=d.y*h;ctx.strokeStyle=dark?'rgba(217,237,250,.19)':'rgba(68,114,147,.12)';ctx.lineWidth=.4*d.size;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-1,y+3*d.size);ctx.stroke();if(d.y>1){const a=(d.y-1)*10;if(a<1){ctx.strokeStyle=`rgba(${dark?'217,237,250':'68,114,147'},${(1-a)*.14})`;ctx.beginPath();ctx.ellipse(d.x*w,h-3,1+a*6,.3+a*1.4,0,0,Math.PI*2);ctx.stroke();}else{d.y=-.03;d.x=Math.random();}}}
        }
